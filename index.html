<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Onyx</title>
  <meta name="description" content="Dein AMOLED optimierter Kalender.">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Import Map für React & Firebase -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.294.0?external=react",
        "firebase/app": "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js",
        "firebase/messaging": "https://www.gstatic.com/firebasejs/11.6.1/firebase-messaging.js"
      }
    }
  </script>

  <!-- Babel für JSX Kompilierung im Browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slide-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .animate-fade-in { animation: fade-in 0.2s ease-out forwards; }
    .animate-slide-up { animation: slide-up 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-spin-fast { animation: spin 0.6s linear infinite; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    body { background-color: #000000; color: #ffffff; overscroll-behavior-y: none; }
    audio { filter: invert(100%) hue-rotate(180deg) brightness(1.5) contrast(1.2); border-radius: 8px; height: 36px; max-width: 220px; }
  </style>
</head>
<body class="selection:bg-neutral-800">
  <div id="root"></div>

  <!-- PWA Service Worker Registrierung -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('firebase-messaging-sw.js').then(registration => {
          console.log('ServiceWorker registriert:', registration.scope);
        }).catch(err => {
          console.log('ServiceWorker Registrierung fehlgeschlagen:', err);
        });
      });
    }
  </script>

  <!-- Deine React App -->
  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useRef } from 'react';
    import { createRoot } from 'react-dom/client';
    import { 
      Calendar as CalendarIcon, Home, Settings, Plus, ChevronLeft, ChevronRight, Video, AlignLeft, Users, Clock, Cloud, Sun, CloudRain, Info, LogOut, MapPin, Search, Download, Upload, Bell, Trash2, CheckCircle2, AlertCircle, Mail, Lock, MessageSquare, Send, Image as ImageIcon, Camera, ArrowLeft, Edit2, CornerUpLeft, X, User, RefreshCw, Mic, Square, Activity, Bomb, CalendarPlus
    } from 'lucide-react';

    import { initializeApp } from "firebase/app";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "firebase/auth";
    import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, query, setDoc, getDocs } from "firebase/firestore";
    import { getMessaging, getToken, onMessage } from "firebase/messaging";

    const customFirebaseConfig = {
      apiKey: "AIzaSyDkdRI4tNh5fe-dyBBGDlGgIiT7vHmoFvg",
      authDomain: "kalender-rai.firebaseapp.com",
      projectId: "kalender-rai",
      storageBucket: "kalender-rai.firebasestorage.app",
      messagingSenderId: "407396898664",
      appId: "1:407396898664:web:3fafd51433481e7bb668dd"
    };

    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : customFirebaseConfig;
    const APP_ID = typeof __app_id !== 'undefined' ? __app_id : 'onyx-pwa-live';

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let messaging = null;
    try { messaging = getMessaging(app); } catch (error) { console.warn("Messaging nicht unterstützt."); }

    const wissenswertes = [
      "Wusstest du, dass Oktopusse drei Herzen haben und ihr Blut blau ist?",
      "Wusstest du, dass Honig niemals verdirbt? Man fand essbaren Honig in ägyptischen Gräbern.",
      "Wusstest du, dass die Schweiz über 1.500 Seen hat? Du bist nie weiter als 16 km von einem See entfernt.",
      "Wusstest du, dass Bananen leicht radioaktiv sind, weil sie viel Kalium enthalten?"
    ];

    const MONATE = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
    const WOCHENTAGE = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];

    function AmoledCalendarApp() {
      const [isAppReady, setIsAppReady] = useState(false);
      const [user, setUser] = useState(null);
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      
      const [isRegistering, setIsRegistering] = useState(false);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [authError, setAuthError] = useState('');
      
      const [currentView, setCurrentView] = useState('dashboard');
      const [currentDate, setCurrentDate] = useState(new Date());
      
      const [weather, setWeather] = useState(null);
      const [dailyForecast, setDailyForecast] = useState(null);
      const [location, setLocation] = useState({ name: 'Oberbüren, SG', lat: 47.45, lon: 9.11 });
      const [dailyFact, setDailyFact] = useState('');
      
      const [isWeatherModalOpen, setIsWeatherModalOpen] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');
      const [searchResults, setSearchResults] = useState([]);

      const [events, setEvents] = useState([]);
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [selectedDateForEvent, setSelectedDateForEvent] = useState(null);
      const [eventToEdit, setEventToEdit] = useState(null);

      // --- GEHEIMER CHAT STATES ---
      const [secretView, setSecretView] = useState('list');
      const [userProfile, setUserProfile] = useState(null);
      const [allProfiles, setAllProfiles] = useState([]);
      const [chatSearchQuery, setChatSearchQuery] = useState('');
      const [myChats, setMyChats] = useState([]);
      const [activeChat, setActiveChat] = useState(null);
      const [chatMessages, setChatMessages] = useState([]);
      const [newMessageText, setNewMessageText] = useState('');
      
      // Specials
      const [replyingTo, setReplyingTo] = useState(null);
      const [editingMessage, setEditingMessage] = useState(null);
      const [selectedMessageId, setSelectedMessageId] = useState(null); 
      const [selfDestruct, setSelfDestruct] = useState(false);
      const [isShareEventModalOpen, setIsShareEventModalOpen] = useState(false);
      
      // Audio Recording
      const [isRecording, setIsRecording] = useState(false);
      const mediaRecorderRef = useRef(null);
      const audioChunksRef = useRef([]);

      // Typing Indicator & Scroll
      const typingTimeoutRef = useRef(null);
      const messagesEndRef = useRef(null);
      
      // Chat Stats
      const [chatStats, setChatStats] = useState({ sent: 0, received: 0, total: 0 });
      const [showPartnerStats, setShowPartnerStats] = useState(false);

      const [lastChatVisit, setLastChatVisit] = useState(() => {
        const stored = localStorage.getItem('onyx_last_chat_visit');
        return stored ? parseInt(stored, 10) : 0;
      });

      const [toasts, setToasts] = useState([]);
      const pressTimer = useRef(null);
      const isLongPressAction = useRef(false);

      // Pull to Refresh States
      const [isRefreshing, setIsRefreshing] = useState(false);
      const [pullDistance, setPullDistance] = useState(0);
      const touchStartY = useRef(0);
      const touchCurrentY = useRef(0);

      useEffect(() => {
        setDailyFact(wissenswertes[Math.floor(Math.random() * wissenswertes.length)]);
        const unsubscribeAuth = onAuthStateChanged(auth, (currentUser) => {
          setUser(currentUser);
          setIsLoggedIn(!!currentUser);
          setIsAppReady(true);
          if (currentUser) {
            requestNotificationPermission(currentUser);
          } else {
            setEvents([]); setUserProfile(null); setMyChats([]); setCurrentView('dashboard');
          }
        });
        return () => unsubscribeAuth();
      }, []);

      useEffect(() => {
        if (currentView === 'secret_chat') {
          const now = Date.now();
          setLastChatVisit(now);
          localStorage.setItem('onyx_last_chat_visit', now.toString());
        } else {
          setSecretView('list');
          setActiveChat(null);
        }
      }, [currentView]);

      useEffect(() => {
        if (!user) return;
        const eventsRef = collection(db, 'artifacts', APP_ID, 'users', user.uid, 'events');
        const unsubscribeEvents = onSnapshot(query(eventsRef), (snapshot) => {
          const loadedEvents = [];
          snapshot.forEach((doc) => loadedEvents.push({ id: doc.id, ...doc.data() }));
          setEvents(loadedEvents);
        });

        const profileRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'profiles', user.uid);
        const unsubscribeProfile = onSnapshot(profileRef, (docSnap) => {
          if (docSnap.exists()) setUserProfile({ id: docSnap.id, ...docSnap.data() });
        });

        const allProfilesRef = collection(db, 'artifacts', APP_ID, 'public', 'data', 'profiles');
        const unsubscribeAllProfiles = onSnapshot(query(allProfilesRef), (snapshot) => {
          const loaded = [];
          snapshot.forEach(doc => loaded.push({ id: doc.id, ...doc.data() }));
          setAllProfiles(loaded);
        });

        const chatsRef = collection(db, 'artifacts', APP_ID, 'public', 'data', 'chats');
        const unsubscribeChats = onSnapshot(query(chatsRef), (snapshot) => {
          const loadedChats = [];
          snapshot.forEach(doc => {
            const data = doc.data();
            if (data.participants && data.participants.includes(user.uid)) loadedChats.push({ id: doc.id, ...data });
          });
          loadedChats.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
          setMyChats(loadedChats);
        });

        return () => { unsubscribeEvents(); unsubscribeProfile(); unsubscribeAllProfiles(); unsubscribeChats(); };
      }, [user]);

      useEffect(() => {
        if (!activeChat || !user) return;
        const messagesRef = collection(db, 'artifacts', APP_ID, 'public', 'data', 'chats', activeChat.id, 'messages');
        const unsubscribeMessages = onSnapshot(query(messagesRef), (snapshot) => {
          const loaded = [];
          const unreadToUpdate = [];
          snapshot.forEach(doc => {
            const data = doc.data();
            loaded.push({ id: doc.id, ...data });
            if (data.senderId !== user.uid && !data.read && currentView === 'secret_chat' && secretView === 'chat') {
              unreadToUpdate.push(doc.id);
            }
          });
          loaded.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
          setChatMessages(loaded);
          
          if (unreadToUpdate.length > 0) {
            unreadToUpdate.forEach(msgId => {
              updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'chats', activeChat.id, 'messages', msgId), { read: true }).catch(()=>{});
            });
          }

          if (currentView === 'secret_chat') {
            const now = Date.now();
            setLastChatVisit(now);
            localStorage.setItem('onyx_last_chat_visit', now.toString());
          }
        });
        return () => unsubscribeMessages();
      }, [activeChat, user, currentView, secretView]);

      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
      }, [chatMessages, secretView]);

      useEffect(() => {
        if (secretView === 'settings' && user) {
          calculateGlobalChatStats();
        }
      }, [secretView, user, myChats]);

      const calculateGlobalChatStats = async () => {
        let sent = 0;
        let received = 0;
        for (const chat of myChats) {
          const messagesRef = collection(db, 'artifacts', APP_ID, 'public', 'data', 'chats', chat.id, 'messages');
          const snap = await getDocs(messagesRef);
          snap.forEach(doc => {
            if (doc.data().senderId === user.uid) sent++;
            else received++;
          });
        }
        setChatStats({ sent, received, total: sent + received });
      };

      const requestNotificationPermission = async (currentUser) => {
        if (!messaging || !currentUser) return;
        try {
          const permission = await Notification.requestPermission();
          if (permission === 'granted') {
            const token = await getToken(messaging, { vapidKey: 'BKwrZYTIUNm4rIcYhwED39WT0elWB8774ObVEKrJWhRlglke_ti9Vx3PTGcHjQZJ34HJw0xRK18oO14jZBI2rJI' });
            if (token) {
              await setDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'profiles', currentUser.uid), { fcmToken: token }, { merge: true });
            }
          }
        } catch (err) { console.log('FCM Error', err); }
      };

      useEffect(() => {
        if (!messaging) return;
        const unsubscribeMessage = onMessage(messaging, (payload) => {
          showToast(payload.notification?.title || "Neue Benachrichtigung!");
        });
        return () => unsubscribeMessage();
      }, []);

      const fetchWeather = async () => {
        try {
          const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${location.lat}&longitude=${location.lon}&current_weather=true&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=auto`);
          const data = await res.json();
          setWeather(data.current_weather);
          setDailyForecast(data.daily);
        } catch (error) {}
      };

      useEffect(() => {
        if (isLoggedIn) fetchWeather();
      }, [location, isLoggedIn]);

      const showToast = (message) => {
        const id = Date.now();
        setToasts(prev => [...prev, { id, message }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3000);
      };

      const getWeatherIcon = (code, className = "w-8 h-8 text-white") => {
        if (code === undefined || code === null) return <Cloud className={className} />;
        if (code <= 3) return <Sun className={className} />;
        if (code >= 50 && code <= 69) return <CloudRain className={className} />;
        return <Cloud className={className} />;
      };

      const formatDayName = (dateString) => {
        const date = new Date(dateString);
        return WOCHENTAGE[date.getDay() === 0 ? 6 : date.getDay() - 1];
      };

      const handleAuth = async (e) => {
        e.preventDefault();
        setAuthError('');
        if (!email || !password) return setAuthError('Bitte E-Mail und Passwort eingeben.');
        try {
          if (isRegistering) {
            await createUserWithEmailAndPassword(auth, email, password);
            showToast("Erfolgreich registriert!");
          } else {
            await signInWithEmailAndPassword(auth, email, password);
            showToast("Erfolgreich angemeldet!");
          }
        } catch (error) {
          switch (error.code) {
            case 'auth/email-already-in-use': setAuthError('Diese E-Mail wird bereits verwendet.'); break;
            case 'auth/invalid-credential':
            case 'auth/user-not-found':
            case 'auth/wrong-password': setAuthError('E-Mail oder Passwort falsch.'); break;
            case 'auth/weak-password': setAuthError('Passwort min. 6 Zeichen.'); break;
            default: setAuthError('Fehler: ' + error.message);
          }
        }
      };

      const handleLogout = async () => {
        try {
          await signOut(auth);
          showToast("Abgemeldet");
          setEmail(''); setPassword('');
        } catch (error) {}
      };

      const handleSearchLocation = async (e) => {
        e.preventDefault();
        if (!searchQuery) return;
        try {
          const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${searchQuery}&count=5&language=de&format=json`);
          const data = await res.json();
          setSearchResults(data.results || []);
        } catch (error) {}
      };

      const selectLocation = (loc) => {
        setLocation({ name: `${loc.name}${loc.admin1 ? `, ${loc.admin1}` : ''}`, lat: loc.latitude, lon: loc.longitude });
        setSearchResults([]); setSearchQuery('');
        showToast(`Standort: ${loc.name}`);
      };

      const getDaysInMonth = (date) => new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate();
      const getFirstDayOfMonth = (date) => {
        let day = new Date(date.getFullYear(), date.getMonth(), 1).getDay();
        return day === 0 ? 6 : day - 1;
      };
      const prevMonth = () => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1));
      const nextMonth = () => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1));
      const goToToday = () => setCurrentDate(new Date());

      const openNewEventModal = (dateStr = null) => {
        setEventToEdit(null); setSelectedDateForEvent(dateStr || new Date().toISOString().split('T')[0]); setIsModalOpen(true);
      };

      const openEditEventModal = (event) => {
        setEventToEdit(event); setSelectedDateForEvent(event.date); setIsModalOpen(true);
      };

      const saveEvent = async (e) => {
        e.preventDefault();
        if (!user) return;
        const formData = new FormData(e.target);
        const eventData = {
          title: formData.get('title'), date: formData.get('date'), time: formData.get('time'),
          type: formData.get('calendarType'), desc: formData.get('desc') || '', updatedAt: Date.now()
        };
        try {
          if (eventToEdit && eventToEdit.id) {
            await updateDoc(doc(db, 'artifacts', APP_ID, 'users', user.uid, 'events', eventToEdit.id), eventData);
            showToast("Aktualisiert");
          } else {
            await addDoc(collection(db, 'artifacts', APP_ID, 'users', user.uid, 'events'), { ...eventData, createdAt: Date.now() });
            showToast("Gespeichert");
          }
          setIsModalOpen(false);
        } catch (error) { showToast("Fehler"); }
      };

      const deleteEvent = async () => {
        if (eventToEdit && eventToEdit.id && user) {
          try {
            await deleteDoc(doc(db, 'artifacts', APP_ID, 'users', user.uid, 'events', eventToEdit.id));
            showToast("Gelöscht"); setIsModalOpen(false);
          } catch (error) {}
        }
      };

      const handleGlobalTouchStart = (e) => {
        if (window.scrollY === 0) {
          touchStartY.current = e.touches[0].clientY;
        }
      };

      const handleGlobalTouchMove = (e) => {
        if (touchStartY.current > 0 && window.scrollY === 0) {
          touchCurrentY.current = e.touches[0].clientY;
          const diff = touchCurrentY.current - touchStartY.current;
          if (diff > 0 && diff < 150) {
            setPullDistance(diff);
          }
        }
      };

      const handleGlobalTouchEnd = async () => {
        if (pullDistance > 60 && !isRefreshing) {
          setIsRefreshing(true);
          setPullDistance(60); 
          showToast("Aktualisiere Daten...");
          await fetchWeather();
          setTimeout(() => {
            setIsRefreshing(false);
            setPullDistance(0);
            touchStartY.current = 0;
          }, 1000);
        } else {
          setPullDistance(0);
          touchStartY.current = 0;
        }
      };

      const handleTouchStart = (day) => {
        if (day === 5) {
          isLongPressAction.current = false;
          pressTimer.current = setTimeout(() => {
            isLongPressAction.current = true; 
            setCurrentView('secret_chat'); 
            setSecretView('list');
            showToast("Verbindung verschlüsselt...");
          }, 3000);
        }
      };

      const handleTouchEnd = () => { if (pressTimer.current) clearTimeout(pressTimer.current); };

      const updateProfileSettings = async (e) => {
        e.preventDefault();
        const uname = new FormData(e.target).get('username').trim();
        if (!uname) return;
        if (allProfiles.some(p => p.username.toLowerCase() === uname.toLowerCase() && p.id !== user.uid)) return showToast("Name vergeben!");
        try {
          const dataToSave = { username: uname, uid: user.uid, email: user.email };
          if (userProfile?.avatarBase64) dataToSave.avatarBase64 = userProfile.avatarBase64;
          await setDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'profiles', user.uid), dataToSave, { merge: true });
          showToast("Profil aktualisiert!");
        } catch (error) { showToast("Fehler beim Speichern"); }
      };

      const handleAvatarUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onloadend = () => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const size = 200; 
            canvas.width = size; canvas.height = size;
            const ctx = canvas.getContext('2d');
            const scale = Math.max(size / img.width, size / img.height);
            const x = (size / scale - img.width) / 2;
            const y = (size / scale - img.height) / 2;
            ctx.drawImage(img, x, y, img.width, img.height, 0, 0, size, size);
            const compressedBase64 = canvas.toDataURL('image/jpeg', 0.8);
            if (user) {
              setDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'profiles', user.uid), { avatarBase64: compressedBase64 }, { merge: true })
                .then(() => showToast("Avatar geändert"))
                .catch(() => showToast("Fehler bei Avatar"));
            }
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      };

      const getProfile = (uid) => allProfiles.find(p => p.id === uid) || null;

      const startChatWith = async (targetUserId) => {
        const existingChat = myChats.find(c => c.participants.includes(targetUserId));
        if (existingChat) {
          setActiveChat(existingChat);
        } else {
          try {
            const newChat = await addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'chats'), {
              participants: [user.uid, targetUserId], updatedAt: Date.now(), lastMessageSenderId: user.uid
            });
            setActiveChat({ id: newChat.id, participants: [user.uid, targetUserId] });
          } catch (error) {}
        }
        setChatSearchQuery('');
        setSecretView('chat');
      };

      const startRecording = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorderRef.current = new MediaRecorder(stream);
          mediaRecorderRef.current.ondataavailable = (e) => {
            if (e.data.size > 0) audioChunksRef.current.push(e.data);
          };
          mediaRecorderRef.current.onstop = () => {
            const audioBlob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
            audioChunksRef.current = [];
            const reader = new FileReader();
            reader.readAsDataURL(audioBlob);
            reader.onloadend = () => {
               sendMessage(null, null, reader.result); 
            };
          };
          audioChunksRef.current = [];
          mediaRecorderRef.current.start();
          setIsRecording(true);
        } catch (err) {
          showToast("Mikrofon-Zugriff verweigert");
        }
      };

      const stopRecording = () => {
        if (mediaRecorderRef.current && isRecording) {
          mediaRecorderRef.current.stop();
          mediaRecorderRef.current.stream.getTracks().forEach(track => track.stop());
          setIsRecording(false);
        }
      };

      const handleTyping = (e) => {
         setNewMessageText(e.target.value);
         if (!activeChat || !user) return;
         updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'chats', activeChat.id), {
           [`typing.${user.uid}`]: true
         }).catch(()=>{});

         if (typingTimeoutRef.current) clearTimeout(typingTimeoutRef.current);
         typingTimeoutRef.current = setTimeout(() => {
            updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'chats', activeChat.id), {
              [`typing.${user.uid}`]: false
            }).catch(()=>{});
         }, 2000);
      };

      const sendMessage = async (e, imageBase64 = null, audioBase64 = null, eventDetails = null) => {
        if (e) e.preventDefault();
        
        if (editingMessage) {
          try {
            await updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'chats', activeChat.id, 'messages', editingMessage.id), {
              text: newMessageText.trim(),
              edited: true
            });
            setEditingMessage(null);
            setNewMessageText('');
          } catch(err) { showToast("Fehler beim Bearbeiten"); }
          return;
        }

        if (!newMessageText.trim() && !imageBase64 && !audioBase64 && !eventDetails) return;
        if (!activeChat || !user) return;
        
        try {
          const payload = {
            senderId: user.uid, 
            text: newMessageText.trim(), 
            image: imageBase64, 
            audio: audioBase64,
            event: eventDetails,
            selfDestruct: selfDestruct,
            timestamp: Date.now(),
            read: false
          };

          if (replyingTo) {
            payload.replyTo = {
              id: replyingTo.id,
              text: replyingTo.text || 'Medien/Termin',
              senderName: replyingTo.senderId === user.uid ? 'Du' : getProfile(replyingTo.senderId)?.username || 'Unbekannt'
            };
          }

          await addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'chats', activeChat.id, 'messages'), payload);
          await updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'chats', activeChat.id), { 
            updatedAt: Date.now(), 
            lastMessageSenderId: user.uid,
            [`typing.${user.uid}`]: false
          });
          
          setNewMessageText('');
          setReplyingTo(null);
          setSelfDestruct(false); // Reset der Bombe nach dem Senden
          const now = Date.now();
          setLastChatVisit(now); localStorage.setItem('onyx_last_chat_visit', now.toString());
        } catch (error) {}
      };

      const acceptSharedEvent = async (eventDetails) => {
        if (!user) return;
        try {
          await addDoc(collection(db, 'artifacts', APP_ID, 'users', user.uid, 'events'), {
            title: eventDetails.title,
            date: eventDetails.date,
            time: eventDetails.time,
            type: 'Projekt', 
            desc: 'Geteilter Termin aus Chat',
            createdAt: Date.now(),
            updatedAt: Date.now()

          showToast("Termin im Kalender gespeichert!");
        } catch (error) { showToast("Fehler beim Speichern"); }
      };

      const deleteMessage = async (msgId) => {
        if (!activeChat || !user) return;

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onloadend = () => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 800; const MAX_HEIGHT = 800;
            let width = img.width; let height = img.height;
            if (width > height) { if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; } } 
            else { if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; } }
            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            sendMessage(null, canvas.toDataURL('image/jpeg', 0.7));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      };

      const getChatPartnerName = (chat) => {

        eventsToExport.forEach(e => {
          const dateStr = e.date.replace(/-/g, ''); const timeStr = e.time.replace(':', '') + '00';

        });

                    <div><h3 className="text-neutral-500 text-xs md:text-sm font-medium uppercase tracking-wider mb-1 flex items-center gap-2"><MapPin className="w-3.5 h-3.5" /> {location.name}</h3><p className="text-3xl md:text-4xl font-light">{weather ? `${Math.round(weather.temperature)}°` : '--°'}</p></div>

                    <Info className="w-5 h-5 md:w-6 md:h-6 text-neutral-400 shrink-0 mt-1" />

                  <div className="space-y-3 md:space-y-4">

                    </button>
                  ) : (
                    <div className="flex items-center gap-3"><MessageSquare className="w-5 h-5 text-white" /><h2 className="text-lg md:text-xl font-medium text-white">Sichere Verbindung</h2></div>
                  )}
                  
                  <div className="ml-auto flex items-center gap-4">
                    {userProfile && secretView === 'list' && (
                      <button onClick={() => setSecretView('settings')} className="text-neutral-500 hover:text-white transition-colors p-2">
                        <Settings className="w-5 h-5" />
                      </button>
                    )}
                    <button onClick={() => { setActiveChat(null); setCurrentView('calendar'); }} className="text-neutral-500 hover:text-white text-2xl leading-none p-2">&times;</button>
                  </div>
                </header>

                <div className="flex-1 overflow-hidden flex flex-col">
                  {!userProfile ? (
                    <div className="flex-1 flex items-center justify-center p-6"><div className="max-w-md w-full border border-neutral-800 p-8 rounded-xl bg-neutral-950/50 text-center"><Lock className="w-8 h-8 mx-auto mb-4 text-neutral-500" /><h3 className="text-xl font-medium mb-2">Identität festlegen</h3><p className="text-sm text-neutral-500 mb-6">Wähle einen einzigartigen Benutzernamen.</p>
                    <form onSubmit={saveUsername}>
                      <input type="text" name="username" defaultValue={user?.email?.split('@')[0]} placeholder="Dein Benutzername" required maxLength={20} className="w-full bg-black border border-neutral-700 text-white placeholder-neutral-600 rounded-lg px-4 py-3 text-center focus:outline-none focus:border-white transition-colors mb-4" />
                      <button type="submit" className="w-full bg-white text-black font-medium py-3 rounded-lg hover:bg-gray-200 transition-colors">Bestätigen</button>
                    </form>
                    </div></div>
                  
                  ) : secretView === 'settings' ? (
                    <div className="flex-1 overflow-y-auto p-6 max-w-2xl w-full mx-auto space-y-8">
                      <div className="flex flex-col items-center border border-neutral-800 rounded-xl p-8 bg-neutral-950/50">
                        <div className="relative mb-6">
                          {userProfile.avatarBase64 ? (
                            <img src={userProfile.avatarBase64} className="w-24 h-24 rounded-full border-2 border-neutral-700 object-cover" />
                          ) : (
                            <div className="w-24 h-24 bg-neutral-900 border-2 border-neutral-700 rounded-full flex items-center justify-center text-3xl font-medium text-neutral-500">{userProfile.username.substring(0,2)}</div>
                          )}
                          <label className="absolute bottom-0 right-0 p-2 bg-white text-black rounded-full cursor-pointer hover:bg-gray-200 shadow-lg">
                            <Camera className="w-4 h-4" />
                            <input type="file" accept="image/*" className="hidden" onChange={handleAvatarUpload} />
                          </label>
                        </div>
                        <form onSubmit={updateProfileSettings} className="w-full max-w-xs space-y-4">
                          <input type="text" name="username" defaultValue={userProfile.username} required className="w-full bg-black border border-neutral-700 text-white rounded-lg px-4 py-3 text-center focus:outline-none focus:border-white transition-colors" />
                          <button type="submit" className="w-full bg-neutral-800 text-white font-medium py-3 rounded-lg hover:bg-neutral-700 transition-colors">Profil speichern</button>
                        </form>
                      </div>

                      <div className="grid grid-cols-3 gap-4 text-center">
                        <div className="border border-neutral-800 rounded-xl p-4 bg-neutral-950/50">
                          <p className="text-xs text-neutral-500 uppercase tracking-widest mb-1">Gesendet</p>
                          <p className="text-2xl font-light text-white">{chatStats.sent}</p>
                        </div>
                        <div className="border border-neutral-800 rounded-xl p-4 bg-neutral-950/50">
                          <p className="text-xs text-neutral-500 uppercase tracking-widest mb-1">Empfangen</p>
                          <p className="text-2xl font-light text-white">{chatStats.received}</p>
                        </div>
                        <div className="border border-neutral-800 rounded-xl p-4 bg-neutral-950/50">
                          <p className="text-xs text-neutral-500 uppercase tracking-widest mb-1">Total</p>
                          <p className="text-2xl font-light text-white">{chatStats.total}</p>
                        </div>
                      </div>
                    </div>

                  ) : secretView === 'list' ? (
                    <div className="flex-1 overflow-y-auto p-4 md:p-8 max-w-2xl w-full mx-auto">
                      <div className="relative mb-8"><Search className="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-neutral-500" /><input type="text" placeholder="Neuen Chat starten (Name suchen)..." value={chatSearchQuery} onChange={(e) => setChatSearchQuery(e.target.value)} className="w-full bg-neutral-900 border border-neutral-800 text-white rounded-full pl-12 pr-4 py-3 focus:outline-none focus:border-neutral-500 transition-colors" />
                        {chatSearchQuery.trim() !== '' && (<div className="absolute top-full left-0 w-full mt-2 bg-neutral-900 border border-neutral-700 rounded-xl overflow-hidden shadow-2xl z-10">{allProfiles.filter(p => p.username.toLowerCase().includes(chatSearchQuery.toLowerCase()) && p.id !== user.uid).length > 0 ? (allProfiles.filter(p => p.username.toLowerCase().includes(chatSearchQuery.toLowerCase()) && p.id !== user.uid).map(profile => (<div key={profile.id} onClick={() => startChatWith(profile.id)} className="p-4 border-b border-neutral-800 last:border-0 hover:bg-neutral-800 cursor-pointer flex items-center gap-3"><div className="w-10 h-10 bg-black border border-neutral-700 rounded-full flex items-center justify-center text-neutral-400 font-medium uppercase overflow-hidden">{profile.avatarBase64 ? <img src={profile.avatarBase64} className="w-full h-full object-cover"/> : profile.username.substring(0,2)}</div><span className="font-medium text-white">{profile.username}</span></div>))) : (<div className="p-4 text-neutral-500 text-sm text-center">Kein Nutzer gefunden.</div>)}</div>)}
                      </div>
                      <h4 className="text-xs uppercase tracking-widest text-neutral-600 mb-4 font-semibold px-2">Verlauf</h4>
                      <div className="space-y-2">{myChats.length === 0 ? (<div className="p-8 text-center border border-dashed border-neutral-800 rounded-xl text-neutral-500 text-sm">Noch keine Chats vorhanden.</div>) : (myChats.map(chat => (<div key={chat.id} onClick={() => { setActiveChat(chat); setSecretView('chat'); }} className="p-4 border border-neutral-800 hover:border-neutral-500 rounded-xl bg-black hover:bg-neutral-950 transition-colors cursor-pointer flex items-center gap-4"><div className="w-12 h-12 bg-neutral-900 border border-neutral-700 rounded-full flex items-center justify-center text-neutral-300 font-medium uppercase shrink-0 overflow-hidden">{getChatPartnerAvatar(chat) ? <img src={getChatPartnerAvatar(chat)} className="w-full h-full object-cover"/> : getChatPartnerName(chat).substring(0,2)}</div><div className="flex-1 overflow-hidden"><h4 className="font-medium text-white truncate">{getChatPartnerName(chat)}</h4>{chat.lastMessageSenderId !== user.uid && chat.updatedAt > lastChatVisit ? (<span className="inline-block mt-1 px-2 py-0.5 bg-white text-black text-[10px] font-bold rounded-sm uppercase tracking-wider">Neu</span>) : (<p className="text-xs text-neutral-500 truncate mt-0.5">Tippen zum Öffnen...</p>)}</div></div>)))}</div>
                    </div>
                  ) : (
                    <div className="flex-1 flex flex-col w-full max-w-3xl mx-auto border-x border-neutral-900 overflow-hidden" onClick={() => setSelectedMessageId(null)}>
                      
                      <div className="flex-1 min-h-0 overflow-y-auto p-4 space-y-4 flex flex-col">
                        {chatMessages.map((msg) => {
                          const isMe = msg.senderId === user.uid;
                          const showActions = selectedMessageId === msg.id;
                          
                          return (
                            <div key={msg.id} className={`flex flex-col ${isMe ? 'items-end' : 'items-start'}`}>
                              <div 
                                onClick={(e) => { e.stopPropagation(); setSelectedMessageId(showActions ? null : msg.id); }}
                                className={`max-w-[85%] rounded-2xl p-3 cursor-pointer transition-colors relative ${isMe ? 'bg-white text-black rounded-tr-sm hover:bg-gray-200' : 'bg-neutral-900 border border-neutral-800 text-white rounded-tl-sm hover:bg-neutral-800'}`}
                              >
                                {/* Selbstzerstörungs-Indikator */}
                                {msg.selfDestruct && (
                                  <div className="text-[10px] text-red-500 font-bold mb-2 flex items-center gap-1">
                                    <Bomb className="w-3 h-3" /> Zerstört sich nach Lesen
                                  </div>
                                )}

                                {msg.replyTo && (
                                  <div className={`text-xs p-2 rounded-lg mb-2 border-l-2 opacity-80 truncate ${isMe ? 'bg-black/10 border-black' : 'bg-black/30 border-white'}`}>
                                    <span className="font-bold">{msg.replyTo.senderName}</span>: {msg.replyTo.text}
                                  </div>
                                )}
                                
                                {msg.image && <img src={msg.image} alt="Upload" className="rounded-lg mb-2 max-h-64 object-contain" />}
                                {msg.audio && <audio src={msg.audio} controls className="mb-2 w-full" />}
                                
                                {/* Termin-Kachel Rendering */}
                                {msg.event && (
                                  <div className={`mt-2 p-3 rounded-xl border ${isMe ? 'bg-black/10 border-black/20' : 'bg-black/40 border-neutral-700'}`}>
                                    <div className="flex items-center gap-2 mb-1">
                                      <CalendarIcon className="w-4 h-4" />
                                      <span className="font-bold">{msg.event.title}</span>
                                    </div>
                                    <div className="text-xs mb-3 opacity-80">
                                      {msg.event.date} um {msg.event.time} Uhr
                                    </div>
                                    {!isMe && (
                                      <button onClick={(e) => { e.stopPropagation(); acceptSharedEvent(msg.event); }} className="w-full bg-white text-black py-1.5 rounded-md text-xs font-bold hover:bg-gray-200 transition-colors">
                                        Zusagen & Eintragen
                                      </button>
                                    )}
                                  </div>
                                )}

                                {msg.text && <p className="text-sm whitespace-pre-wrap">{msg.text}</p>}
                                
                                <div className={`flex items-center gap-1 mt-1 justify-end opacity-60 ${isMe ? 'text-black' : 'text-neutral-400'}`}>
                                  {msg.edited && <span className="text-[9px] mr-1">(bearbeitet)</span>}
                                  <span className="text-[10px] block text-right">
                                    {new Date(msg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}
                                  </span>
                                  {isMe && (
                                    <span className="text-[10px] ml-1">{msg.read ? '👀' : '👁️'}</span>
                                  )}
                                </div>

                                {showActions && (
                                  <div className={`absolute top-full mt-1 flex items-center gap-1 bg-neutral-800 border border-neutral-700 rounded-lg p-1 z-10 shadow-xl ${isMe ? 'right-0' : 'left-0'}`}>
                                    <button onClick={(e) => { e.stopPropagation(); setReplyingTo(msg); setSelectedMessageId(null); document.getElementById('chatInput').focus(); }} className="p-2 text-white hover:bg-neutral-700 rounded-md" title="Antworten"><CornerUpLeft className="w-4 h-4" /></button>
                                    {isMe && !msg.image && !msg.audio && !msg.event && (
                                      <button onClick={(e) => { e.stopPropagation(); setEditingMessage(msg); setNewMessageText(msg.text); setReplyingTo(null); setSelectedMessageId(null); document.getElementById('chatInput').focus(); }} className="p-2 text-white hover:bg-neutral-700 rounded-md" title="Bearbeiten"><Edit2 className="w-4 h-4" /></button>
                                    )}
                                    {isMe && (
                                      <button onClick={(e) => { e.stopPropagation(); deleteMessage(msg.id); }} className="p-2 text-red-400 hover:bg-neutral-700 rounded-md" title="Löschen"><Trash2 className="w-4 h-4" /></button>
                                    )}
                                  </div>
                                )}
                              </div>
                            </div>
                          );
                        })}
                        <div ref={messagesEndRef} />
                      </div>

                      <div className="p-4 bg-neutral-950 border-t border-neutral-900 shrink-0">
                        {(replyingTo || editingMessage) && (
                          <div className="flex items-center justify-between bg-neutral-900 border border-neutral-800 p-2 px-3 rounded-t-xl text-xs text-neutral-400 border-b-0">
                            <span className="truncate">
                              {editingMessage ? 'Nachricht bearbeiten...' : `Antwort an ${replyingTo.senderId === user.uid ? 'Dich' : getProfile(replyingTo.senderId)?.username || 'Unbekannt'}: ${replyingTo.text?.substring(0,30) || 'Medien'}...`}
                            </span>
                            <button onClick={() => { setReplyingTo(null); setEditingMessage(null); setNewMessageText(''); }} className="hover:text-white shrink-0 ml-2"><X className="w-4 h-4"/></button>
                          </div>
                        )}

                        <form onSubmit={(e) => sendMessage(e)} className="flex items-end gap-2 relative">
                          <div className={`relative shrink-0 flex gap-1 ${editingMessage ? 'hidden' : ''}`}>
                            <label className="cursor-pointer p-3 bg-neutral-900 border border-neutral-800 hover:border-neutral-500 transition-colors rounded-full flex items-center justify-center" title="Bild senden">
                              <ImageIcon className="w-5 h-5 text-neutral-400" /><input type="file" accept="image/*" className="hidden" onChange={handleImageUpload} />
                            </label>
                            
                            <button type="button" onClick={() => setIsShareEventModalOpen(true)} className="p-3 bg-neutral-900 border border-neutral-800 hover:border-neutral-500 transition-colors rounded-full flex items-center justify-center text-neutral-400 hover:text-white" title="Termin teilen">
                              <CalendarPlus className="w-5 h-5" />
                            </button>

                            <button type="button" onClick={() => setSelfDestruct(!selfDestruct)} className={`p-3 border transition-colors rounded-full flex items-center justify-center hidden sm:flex ${selfDestruct ? 'bg-red-900/30 border-red-500 text-red-500' : 'bg-neutral-900 border-neutral-800 hover:border-neutral-500 text-neutral-400'}`} title="Snapchat-Modus (10s)">
                              <Bomb className="w-5 h-5" />
                            </button>
                          </div>
                          
                          <div className="flex-1 relative">
                            {isRecording ? (
                              <div className="w-full bg-red-950 border border-red-900 text-red-500 rounded-2xl pl-4 pr-12 py-3 flex items-center justify-between animate-pulse">
                                <span className="text-sm font-medium">Aufnahme läuft...</span>
                              </div>
                            ) : (
                              <textarea 
                                id="chatInput"
                                value={newMessageText} 
                                onChange={handleTyping} 
                                onKeyDown={(e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(e); } }} 
                                placeholder="Nachricht..." 
                                rows="1" 
                                className={`w-full bg-black border border-neutral-800 text-white pl-4 pr-24 py-3 focus:outline-none focus:border-neutral-500 transition-colors resize-none overflow-y-auto block text-sm ${(replyingTo || editingMessage) ? 'rounded-b-2xl rounded-t-none border-t-0' : 'rounded-2xl'} ${selfDestruct ? 'border-red-900/50 focus:border-red-500' : ''}`} 
                                style={{ minHeight: '44px', maxHeight: '120px' }} 
                              />
                            )}
                            
                            <div className="absolute right-1 bottom-1 flex items-center">
                              {!newMessageText.trim() && !editingMessage && (
                                <button type="button" onClick={isRecording ? stopRecording : startRecording} className={`p-2 rounded-full transition-colors ${isRecording ? 'text-red-500 hover:bg-red-900/30' : 'text-neutral-400 hover:text-white hover:bg-neutral-800'}`}>
                                  {isRecording ? <Square className="w-5 h-5" fill="currentColor" /> : <Mic className="w-5 h-5" />}
                                </button>
                              )}
                              
                              {(!isRecording && (newMessageText.trim() || editingMessage)) && (
                                <button type="submit" className="p-2 text-white hover:bg-neutral-800 rounded-full transition-colors"><Send className="w-5 h-5" /></button>
                              )}
                            </div>
                          </div>
                        </form>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            )}
          </main>

          {showPartnerStats && activeChat && (
             <div className="fixed inset-0 z-[70] bg-black/90 backdrop-blur-md flex items-center justify-center p-4">
                <div className="w-full max-w-sm bg-neutral-950 border border-neutral-800 rounded-2xl p-6 relative animate-fade-in shadow-2xl">
                   <button onClick={() => setShowPartnerStats(false)} className="absolute top-4 right-4 text-neutral-500 hover:text-white"><X className="w-5 h-5"/></button>
                   <div className="flex flex-col items-center mb-8">
                     {getChatPartnerAvatar(activeChat) ? (
                        <img src={getChatPartnerAvatar(activeChat)} className="w-20 h-20 rounded-full border-2 border-neutral-700 object-cover mb-4" />
                      ) : (
                        <div className="w-20 h-20 bg-neutral-900 border-2 border-neutral-700 rounded-full flex items-center justify-center text-2xl font-bold text-white uppercase mb-4">{getChatPartnerName(activeChat).substring(0,2)}</div>
                      )}
                      <h3 className="text-xl font-medium text-white">{getChatPartnerName(activeChat)}</h3>
                      <p className="text-xs text-neutral-500 uppercase tracking-widest mt-1">Chat Analyse</p>
                   </div>
                   
                   <div className="grid grid-cols-2 gap-4">
                     <div className="bg-black border border-neutral-800 p-4 rounded-xl text-center">
                       <p className="text-xs text-neutral-500 uppercase mb-1">Von Dir</p>
                       <p className="text-2xl font-light text-white">{chatMessages.filter(m => m.senderId === user.uid).length}</p>
                     </div>
                     <div className="bg-black border border-neutral-800 p-4 rounded-xl text-center">
                       <p className="text-xs text-neutral-500 uppercase mb-1">Von {getChatPartnerName(activeChat).substring(0,6)}.</p>
                       <p className="text-2xl font-light text-white">{chatMessages.filter(m => m.senderId !== user.uid).length}</p>
                     </div>
                   </div>
                   <div className="mt-4 bg-neutral-900 border border-neutral-800 p-4 rounded-xl text-center flex items-center justify-center gap-3">
                     <Activity className="w-5 h-5 text-neutral-400" />
                     <p className="text-sm text-neutral-300">Total <strong className="text-white ml-1">{chatMessages.length}</strong> Nachrichten</p>
                   </div>
                </div>
             </div>
          )}

          {isShareEventModalOpen && (
            <div className="fixed inset-0 z-[80] bg-black/90 backdrop-blur-sm flex items-center justify-center p-4">
               <div className="bg-neutral-950 border border-neutral-800 w-full max-w-sm rounded-xl p-6 shadow-2xl animate-fade-in">
                  <h3 className="text-lg font-medium text-white mb-4 flex items-center gap-2"><CalendarPlus className="w-5 h-5"/> Termin teilen</h3>
                  <form onSubmit={(e) => {
                    e.preventDefault();
                    const fd = new FormData(e.target);
                    const ev = { title: fd.get('title'), date: fd.get('date'), time: fd.get('time'), type: 'Chat-Einladung' };
                    sendMessage(null, null, null, ev);
                    setIsShareEventModalOpen(false);
                  }} className="space-y-4">
                    <input type="text" name="title" required placeholder="Titel (z.B. Kino heute?)" className="w-full bg-black border border-neutral-700 text-white rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-neutral-500" />
                    <div className="flex gap-2">
                      <input type="date" name="date" required defaultValue={new Date().toISOString().split('T')[0]} className="w-full bg-black border border-neutral-700 text-white rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-neutral-500" />
                      <input type="time" name="time" required defaultValue="18:00" className="w-full bg-black border border-neutral-700 text-white rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-neutral-500" />
                    </div>
                    <div className="flex gap-2 pt-2">
                      <button type="button" onClick={() => setIsShareEventModalOpen(false)} className="flex-1 py-3 rounded-lg text-sm text-neutral-400 hover:text-white bg-neutral-900 border border-neutral-800 transition-colors">Abbrechen</button>
                      <button type="submit" className="flex-1 py-3 rounded-lg text-sm font-medium bg-white text-black hover:bg-gray-200 transition-colors">In Chat senden</button>
                    </div>
                  </form>
               </div>
            </div>
          )}
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<AmoledCalendarApp />);
  </script>
</body>
</html>
