<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Onyx</title>
  <meta name="description" content="Dein AMOLED optimierter Kalender." />
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- PWA -->
  <link rel="manifest" href="%BASE_URL%manifest.json" />
  <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />

  <!-- Favicons -->
  <link rel="icon" href="%BASE_URL%favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%favicon-16.png" />
</head>
<body class="selection:bg-neutral-800">
  <div id="root"></div>

  <!-- Firebase Messaging Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('%BASE_URL%firebase-messaging-sw.js')
          .then(reg => console.log('ServiceWorker registriert:', reg.scope))
          .catch(err => console.log('ServiceWorker Registrierung fehlgeschlagen:', err));
      });
    }
  </script>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
