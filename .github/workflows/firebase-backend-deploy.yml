name: firebase-backend-deploy

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "functions/**"
      - "firestore.rules"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/firebase-backend-deploy.yml"

permissions:
  contents: read

concurrency:
  group: firebase-backend
  cancel-in-progress: true

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      FIREBASE_PROJECT_ID: kalender-rai
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Check required secret
        shell: bash
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Missing repository secret: FIREBASE_SERVICE_ACCOUNT"
            echo "Add the full JSON content of your Firebase service account key as a GitHub Actions secret."
            exit 1
          fi

      - name: Verify repository layout
        shell: bash
        run: |
          pwd
          ls -la
          test -f firebase.json || (echo "firebase.json fehlt im Repo-Root" && exit 1)
          test -f .firebaserc || (echo ".firebaserc fehlt im Repo-Root" && exit 1)
          test -d functions || (echo "functions Ordner fehlt im Repo-Root" && exit 1)
          test -f functions/package.json || (echo "functions/package.json fehlt" && exit 1)
          echo "Repository layout ok"

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          project_id: kalender-rai

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Cloud Functions dependencies
        run: npm ci
        working-directory: functions

      - name: Select Firebase project
        run: firebase use "$FIREBASE_PROJECT_ID" --non-interactive

      - name: Deploy Cloud Functions and Firestore Rules
        run: firebase deploy --project "$FIREBASE_PROJECT_ID" --only functions,firestore:rules --non-interactive
